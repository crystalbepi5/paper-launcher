name: Build diagnostic APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :diagnostic:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paper-diagnostic
          path: diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp diagnostic/build/outputs/apk/debug/diagnostic-debug.apk paper-diagnostic.apk
          gh release create "diagnostic-${{ github.run_number }}" paper-diagnostic.apk \
            --title "Paper Diagnostic build ${{ github.run_number }}" \
            --notes "Read-only device diagnostic. It does not become your home screen."
